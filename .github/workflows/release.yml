name: Windows desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - shell: pwsh
        run: |
          if ((zig version) -ne '0.13.0') { throw 'Unexpected compiler' }
          zig cc test.c -o "$env:RUNNER_TEMP/test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install innosetup --version=6.4.3 --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmd /c Build-Installer.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item dist/Nivora.exe
          if ($exe.VersionInfo.ProductVersion -ne '1.1.0') { throw 'Missing version metadata' }
          $p = Start-Process $exe.FullName -PassThru
          try {
            if (-not $p.WaitForInputIdle(15000)) { throw 'Window did not initialize' }
            $p.Refresh()
            if ($p.HasExited -or $p.MainWindowTitle -ne 'Nivora') { throw 'Dashboard unavailable' }
          } finally { if (!$p.HasExited) { $p.Kill() } }
      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "Nivora Installer Test"
          $setup = Start-Process (Resolve-Path dist/Nivora-Setup-1.1.0-x64.exe) -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dest`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$dest/Nivora.exe")) { throw "Installation failed" }
          $uninstaller = Start-Process "$dest/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path "$dest/Nivora.exe")) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Nivora-windows-x64
          path: |
            dist/Nivora-Setup-1.1.0-x64.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nivora-windows-x64
      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Nivora $TAG" Nivora-Setup-1.1.0-x64.exe SHA256SUMS.txt
